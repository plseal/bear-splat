<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小熊喷喷 · Bear Splat!</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#bfe9ff;font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",sans-serif;user-select:none}
canvas#gl{display:block;cursor:crosshair}
#hud{position:fixed;inset:0;pointer-events:none;display:none}
#top{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px}
#timer{font-size:34px;font-weight:900;color:#fff;text-shadow:0 3px 0 #2b2b44,0 0 12px rgba(0,0,0,.25);letter-spacing:2px}
#cov{width:440px;height:24px;border-radius:14px;background:#eee8dc;border:3px solid #2b2b44;position:relative;overflow:hidden;box-shadow:0 4px 0 rgba(0,0,0,.2)}
#cov1,#cov2{position:absolute;top:0;bottom:0;transition:width .25s}
#cov1{left:0;background:linear-gradient(#ffc04d,#ff9f1c)}
#cov2{right:0;background:linear-gradient(#7b8fff,#3d5afe)}
#covtxt{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 10px;font-weight:900;font-size:14px;color:#fff;text-shadow:0 1px 2px #000}
#teams{display:flex;gap:30px;font-weight:800;font-size:13px;color:#2b2b44}
.tm{display:flex;gap:4px;align-items:center}.dot{width:16px;height:16px;border-radius:50%;border:2px solid #2b2b44}
.dot.dead{opacity:.25}
#ink{position:absolute;left:24px;bottom:24px;display:flex;align-items:flex-end;gap:12px}
#tank{width:54px;height:150px;border:4px solid #2b2b44;border-radius:14px 14px 18px 18px;background:rgba(255,255,255,.6);position:relative;overflow:hidden;box-shadow:0 4px 0 rgba(0,0,0,.2)}
#tankfill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#ffd166,#ff9f1c);transition:height .08s}
#tank.low{animation:blink .4s infinite}
#tanklbl{position:absolute;bottom:4px;width:100%;text-align:center;font-weight:900;color:#2b2b44;font-size:13px}
#hpwrap{display:flex;flex-direction:column;gap:6px;font-weight:900;color:#2b2b44;font-size:13px}
#hpbar{width:160px;height:16px;border:3px solid #2b2b44;border-radius:10px;background:#fff;overflow:hidden}
#hpfill{height:100%;background:linear-gradient(90deg,#ff5d73,#ff8fa3);width:100%}
#bombbar{width:160px;height:10px;border:2px solid #2b2b44;border-radius:6px;background:#fff;overflow:hidden}
#bombfill{height:100%;background:#2b2b44;width:0}
@keyframes blink{50%{border-color:#ff3355}}
#mini{position:absolute;right:20px;bottom:20px;width:170px;height:170px;border:4px solid #2b2b44;border-radius:14px;background:#eee;box-shadow:0 4px 0 rgba(0,0,0,.2)}
#feed{position:absolute;right:20px;top:18px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.kf{background:rgba(43,43,68,.85);color:#fff;padding:5px 12px;border-radius:20px;font-size:14px;font-weight:700;animation:pop .25s}
.kf b.t1{color:#ffc04d}.kf b.t2{color:#9aa8ff}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
#big{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);font-size:84px;font-weight:900;color:#fff;-webkit-text-stroke:3px #2b2b44;text-shadow:0 6px 0 #2b2b44;opacity:0;transition:opacity .2s;white-space:nowrap}
#toast{position:absolute;bottom:200px;left:50%;transform:translateX(-50%);background:rgba(43,43,68,.85);color:#fff;padding:8px 18px;border-radius:20px;font-weight:700;opacity:0;transition:opacity .25s}
#dead{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:radial-gradient(transparent 30%,rgba(61,90,254,.45));color:#fff;font-weight:900;font-size:30px;text-shadow:0 3px 0 #2b2b44}
#vig{position:absolute;inset:0;box-shadow:inset 0 0 160px rgba(255,40,70,.9);opacity:0;transition:opacity .15s}
#inkvig{position:absolute;inset:0;box-shadow:inset 0 0 120px rgba(61,90,254,.7);opacity:0;transition:opacity .2s}
#hitm{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;opacity:0;font-size:26px;line-height:26px;text-align:center;color:#fff;font-weight:900;text-shadow:0 0 3px #000}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(30,30,55,.45);backdrop-filter:blur(3px)}
.card{background:#fffaf0;border:5px solid #2b2b44;border-radius:28px;padding:28px 40px;box-shadow:0 10px 0 #2b2b44;text-align:center;max-width:620px;width:92%}
.card h1{font-size:52px;font-weight:900;color:#ff9f1c;-webkit-text-stroke:2px #2b2b44;text-shadow:0 5px 0 #2b2b44;letter-spacing:3px}
.card h1 span{color:#3d5afe}
.sub{margin:10px 0 18px;color:#2b2b44;font-weight:700}
.keys{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;text-align:left;margin:0 auto 22px;width:max-content;color:#2b2b44;font-weight:700}
.k{background:#2b2b44;color:#fff;border-radius:8px;padding:2px 10px;font-size:14px;text-align:center}
.btn{pointer-events:auto;cursor:pointer;font:inherit;font-size:24px;font-weight:900;color:#fff;background:#ff9f1c;border:4px solid #2b2b44;border-radius:40px;padding:10px 46px;box-shadow:0 6px 0 #2b2b44;transition:transform .1s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #2b2b44}
#end{display:none}
#winner{font-size:46px;font-weight:900;-webkit-text-stroke:2px #2b2b44;text-shadow:0 5px 0 #2b2b44;margin-bottom:18px}
.res{display:flex;align-items:center;gap:12px;margin:10px 0;font-weight:900;color:#2b2b44;font-size:18px}
.res .bar{flex:1;height:30px;background:#eee8dc;border:3px solid #2b2b44;border-radius:16px;overflow:hidden}
.res .fill{height:100%;width:0;transition:width 1.4s cubic-bezier(.2,.9,.3,1.2)}
.res .lbl{width:110px;text-align:left;white-space:nowrap}.res .pct{width:72px;text-align:right}
#stats{margin:16px 0 22px;color:#2b2b44;font-weight:700}
</style>
</head>
<body>
<div id="hud">
  <div id="top">
    <div id="timer">2:00</div>
    <div id="cov"><div id="cov1"></div><div id="cov2"></div><div id="covtxt"><span id="c1t">0%</span><span id="c2t">0%</span></div></div>
    <div id="teams"><div class="tm" id="tm1"></div><div class="tm" id="tm2"></div></div>
  </div>
  <div id="feed"></div>
  <div id="ink">
    <div id="tank"><div id="tankfill"></div><div id="tanklbl">墨水</div></div>
    <div id="hpwrap">体力<div id="hpbar"><div id="hpfill"></div></div>蜂蜜炸弹 [E]<div id="bombbar"><div id="bombfill"></div></div></div>
  </div>
  <canvas id="mini" width="170" height="170"></canvas>
  <div id="inkvig"></div><div id="vig"></div>
  <div id="big"></div><div id="toast"></div><div id="hitm">✕</div>
  <div id="dead"><div id="deadmsg">被击倒了!</div><div id="deadcd" style="font-size:22px">3</div></div>
</div>
<div class="ov" id="start">
  <div class="card">
    <h1>小熊<span>喷喷</span>!</h1>
    <div class="sub">🍯 蜂蜜队 vs 🫐 蓝莓队 · 3 vs 3 涂地大战 · 时间结束时涂地面积多的一方获胜</div>
    <div class="keys">
      <span class="k">W A S D</span><span>移动</span>
      <span class="k">鼠标</span><span>瞄准</span>
      <span class="k">左键 (按住)</span><span>喷射蜂蜜墨水</span>
      <span class="k">Shift / 空格</span><span>变成墨水团潜行：自己颜色里 超快 + 补墨 + 隐身</span>
      <span class="k">E / 右键</span><span>投掷蜂蜜炸弹（消耗 55% 墨水）</span>
    </div>
    <button class="btn" id="startbtn">开始游戏!</button>
  </div>
</div>
<div class="ov" id="end">
  <div class="card">
    <div id="winner">蜂蜜队 胜利!</div>
    <div class="res"><span class="lbl">🍯 蜂蜜队</span><div class="bar"><div class="fill" id="r1" style="background:#ff9f1c"></div></div><span class="pct" id="p1">0%</span></div>
    <div class="res"><span class="lbl">🫐 蓝莓队</span><div class="bar"><div class="fill" id="r2" style="background:#3d5afe"></div></div><span class="pct" id="p2">0%</span></div>
    <div id="stats"></div>
    <button class="btn" id="restartbtn">再来一局!</button>
  </div>
</div>

<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

// ---------------- config ----------------
const Q = new URLSearchParams(location.search);
const MATCH_TIME = Math.max(5, parseFloat(Q.get('t')) || 120);
const HALF = 30, SIZE = 60, GRID = 150, CELL = SIZE / GRID, TEX = 1024, PPU = TEX / SIZE;
const TEAM_HEX = [null, '#ff9f1c', '#3d5afe'];
const TEAM_LIGHT = [null, 'rgba(255,224,130,0.45)', 'rgba(160,175,255,0.45)'];
const TEAM_NAME = [null, '蜂蜜队', '蓝莓队'];
const SPAWN = [null, new THREE.Vector3(0, 0, 26), new THREE.Vector3(0, 0, -26)];
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const $ = id => document.getElementById(id);

// ---------------- renderer / scene ----------------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.domElement.id = 'gl';
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#bfe9ff');
scene.fog = new THREE.Fog('#bfe9ff', 60, 120);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 300);
camera.position.set(0, 30, 40);
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });

scene.add(new THREE.HemisphereLight('#ffffff', '#c9b99a', 1.6));
const sun = new THREE.DirectionalLight('#fff3dc', 2.2);
sun.position.set(18, 38, 16); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -38, right: 38, top: 38, bottom: -38, near: 1, far: 100 });
sun.shadow.bias = -0.0006;
scene.add(sun);

const grad = new THREE.DataTexture(new Uint8Array([120, 200, 255]), 3, 1, THREE.RedFormat);
grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.needsUpdate = true;
const toon = (c, extra = {}) => new THREE.MeshToonMaterial({ color: c, gradientMap: grad, ...extra });

// ---------------- paint floor ----------------
const paintCanvas = document.createElement('canvas');
paintCanvas.width = paintCanvas.height = TEX;
const pctx = paintCanvas.getContext('2d');
function drawBaseFloor() {
  pctx.fillStyle = '#efe9dd'; pctx.fillRect(0, 0, TEX, TEX);
  const step = 4 * PPU;
  for (let i = 0; i < 15; i++) for (let j = 0; j < 15; j++) if ((i + j) % 2) { pctx.fillStyle = '#e4dccb'; pctx.fillRect(i * step, j * step, step, step); }
  pctx.strokeStyle = 'rgba(255,255,255,0.9)'; pctx.lineWidth = 6;
  pctx.beginPath(); pctx.arc(TEX / 2, TEX / 2, 9 * PPU, 0, Math.PI * 2); pctx.stroke();
  pctx.beginPath(); pctx.moveTo(0, TEX / 2); pctx.lineTo(TEX, TEX / 2); pctx.stroke();
}
drawBaseFloor();
const floorTex = new THREE.CanvasTexture(paintCanvas);
floorTex.colorSpace = THREE.SRGBColorSpace;
floorTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
const floor = new THREE.Mesh(new THREE.PlaneGeometry(SIZE, SIZE), new THREE.MeshLambertMaterial({ map: floorTex }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
let texDirty = false;

const grass = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), toon('#9fd86b'));
grass.rotation.x = -Math.PI / 2; grass.position.y = -0.4; grass.receiveShadow = true; scene.add(grass);
// arena base + fence
const base = new THREE.Mesh(new THREE.BoxGeometry(SIZE + 2, 0.4, SIZE + 2), toon('#d9cdb6'));
base.position.y = -0.21; base.receiveShadow = true; scene.add(base);
const fenceMat = toon('#ffffff');
for (const [x, z, w, d] of [[0, -HALF - .4, SIZE + 1.6, .8], [0, HALF + .4, SIZE + 1.6, .8], [-HALF - .4, 0, .8, SIZE], [HALF + .4, 0, .8, SIZE]]) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, 1, d), fenceMat); m.position.set(x, .5, z); m.castShadow = m.receiveShadow = true; scene.add(m);
}
// trees outside
const trunkMat = toon('#9b6b43'), leafMat = toon('#5fbf5a'), leafMat2 = toon('#7fd36e');
for (let i = 0; i < 26; i++) {
  const a = i / 26 * Math.PI * 2 + rand(-.1, .1), r = rand(40, 52);
  const g = new THREE.Group(); g.position.set(Math.cos(a) * r, -0.4, Math.sin(a) * r);
  const t = new THREE.Mesh(new THREE.CylinderGeometry(.4, .5, 2.5), trunkMat); t.position.y = 1.25; g.add(t);
  const l = new THREE.Mesh(new THREE.SphereGeometry(rand(1.8, 2.6), 12, 10), Math.random() < .5 ? leafMat : leafMat2); l.position.y = 3.6; g.add(l);
  g.traverse(o => o.castShadow = true); scene.add(g);
}

// grid
const grid = new Uint8Array(GRID * GRID), blocked = new Uint8Array(GRID * GRID);
const counts = [0, 0, 0];
const BOX_DEF = [
  [0, 0, 6, 6, 1.6], [-13, -9, 4, 3, 1.4], [13, -9, 4, 3, 1.4], [-13, 9, 4, 3, 1.4], [13, 9, 4, 3, 1.4],
  [-22, 0, 2, 9, 1.8], [22, 0, 2, 9, 1.8], [-6, -17, 5, 1.6, 1.2], [6, 17, 5, 1.6, 1.2], [8, -18, 1.6, 1.6, 1.2], [-8, 18, 1.6, 1.6, 1.2]
];
const BOX_COL = ['#f7b2bd', '#a0e7e5', '#b4f8c8', '#fbe7c6', '#cdb4db'];
const boxes = BOX_DEF.map(([x, z, w, d, h], i) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), toon(BOX_COL[i % BOX_COL.length]));
  m.position.set(x, h / 2, z); m.castShadow = m.receiveShadow = true; scene.add(m);
  const top = new THREE.Mesh(new THREE.BoxGeometry(w + .1, .12, d + .1), toon('#ffffff')); top.position.set(x, h, z); top.castShadow = true; scene.add(top);
  return { x, z, w, d, h, minX: x - w / 2, maxX: x + w / 2, minZ: z - d / 2, maxZ: z + d / 2 };
});
let blockedCount = 0;
for (let j = 0; j < GRID; j++) for (let i = 0; i < GRID; i++) {
  const x = -HALF + (i + .5) * CELL, z = -HALF + (j + .5) * CELL;
  if (inBox(x, z)) { blocked[j * GRID + i] = 1; blockedCount++; }
}
const PAINTABLE = GRID * GRID - blockedCount;
function inBox(x, z, pad = 0) {
  for (const b of boxes) if (x > b.minX - pad && x < b.maxX + pad && z > b.minZ - pad && z < b.maxZ + pad) return b;
  return null;
}
function cellTeam(x, z) {
  const i = Math.floor((x + HALF) / CELL), j = Math.floor((z + HALF) / CELL);
  if (i < 0 || j < 0 || i >= GRID || j >= GRID) return 0;
  return grid[j * GRID + i];
}
function paint(x, z, r, team, owner = null, droplets = true) {
  const ci = (x + HALF) / CELL, cj = (z + HALF) / CELL, cr = r / CELL, cr2 = cr * cr;
  const i0 = Math.max(0, Math.floor(ci - cr)), i1 = Math.min(GRID - 1, Math.ceil(ci + cr));
  const j0 = Math.max(0, Math.floor(cj - cr)), j1 = Math.min(GRID - 1, Math.ceil(cj + cr));
  let changed = 0;
  for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
    const dx = i + .5 - ci, dy = j + .5 - cj;
    if (dx * dx + dy * dy > cr2) continue;
    const k = j * GRID + i;
    if (blocked[k] || grid[k] === team) continue;
    if (grid[k]) counts[grid[k]]--;
    grid[k] = team; counts[team]++; changed++;
  }
  if (owner) owner.painted += changed;
  const px = (x + HALF) * PPU, py = (z + HALF) * PPU, pr = r * PPU;
  pctx.fillStyle = TEAM_HEX[team];
  pctx.beginPath(); pctx.arc(px, py, pr, 0, Math.PI * 2); pctx.fill();
  if (droplets) {
    const n = 3 + (Math.random() * 5 | 0);
    for (let k = 0; k < n; k++) {
      const a = rand(0, Math.PI * 2), d = pr * rand(.7, 1.3), rr = pr * rand(.15, .38);
      pctx.beginPath(); pctx.arc(px + Math.cos(a) * d, py + Math.sin(a) * d, rr, 0, Math.PI * 2); pctx.fill();
    }
    pctx.fillStyle = TEAM_LIGHT[team];
    pctx.beginPath(); pctx.arc(px - pr * .3, py - pr * .3, pr * .35, 0, Math.PI * 2); pctx.fill();
  }
  texDirty = true;
}

// spawn pads
for (const t of [1, 2]) {
  const pad = new THREE.Mesh(new THREE.CylinderGeometry(3.2, 3.4, .14, 32), toon(TEAM_HEX[t], { transparent: true, opacity: .55 }));
  pad.position.set(SPAWN[t].x, .07, SPAWN[t].z); scene.add(pad);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(3.3, .12, 8, 40), toon('#ffffff'));
  ring.rotation.x = Math.PI / 2; ring.position.set(SPAWN[t].x, .16, SPAWN[t].z); scene.add(ring);
}

// ---------------- audio ----------------
let AC = null, master, noiseBuf;
function initAudio() {
  if (AC) { AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = .45; master.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate * .6, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
function tone(type, f0, f1, dur, vol, delay = 0) {
  if (!AC) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(master); o.start(t); o.stop(t + dur + .02);
}
function noise(dur, vol, freq, type = 'bandpass', q = 1) {
  if (!AC) return;
  const t = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = type; f.frequency.value = freq; f.Q.value = q;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  s.connect(f).connect(g).connect(master); s.start(t, Math.random() * .1); s.stop(t + dur + .02);
}
let lastSplat = 0;
const sfx = {
  shoot() { noise(.07, .16, 2400, 'bandpass', .8); tone('triangle', 760, 260, .06, .06); },
  splat(v) { const n = performance.now(); if (n - lastSplat < 45 || v < .05) return; lastSplat = n; noise(.09, .14 * v, 650, 'lowpass'); },
  hit() { tone('square', 1300, 1000, .05, .06); },
  hurt() { tone('sawtooth', 320, 110, .16, .12); },
  ko() { noise(.4, .4, 500, 'lowpass'); tone('sine', 520, 70, .45, .22); },
  swimIn() { tone('sine', 180, 720, .12, .14); },
  swimOut() { tone('sine', 650, 240, .1, .1); },
  bubble() { tone('sine', rand(300, 700), rand(800, 1200), .05, .03); },
  empty() { tone('square', 180, 160, .06, .05); },
  boom() { noise(.6, .55, 300, 'lowpass'); tone('sine', 160, 40, .55, .35); },
  beep(hi) { tone('square', hi ? 1320 : 880, hi ? 1320 : 880, hi ? .45 : .15, .08); },
  whistle() { tone('sine', 1800, 2300, .7, .12); tone('sine', 1800, 2300, .7, .12, .8); },
  throw() { tone('triangle', 400, 900, .15, .1); },
};

// ---------------- particles ----------------
const partGeo = new THREE.SphereGeometry(.13, 6, 5);
const partMats = [null, toon(TEAM_HEX[1]), toon(TEAM_HEX[2])];
const parts = [];
for (let i = 0; i < 320; i++) { const m = new THREE.Mesh(partGeo, partMats[1]); m.visible = false; scene.add(m); parts.push({ m, v: new THREE.Vector3(), life: 0, s: 1 }); }
let partIdx = 0;
function burst(x, y, z, team, n, spd = 5, up = 4) {
  for (let i = 0; i < n; i++) {
    const p = parts[partIdx++ % parts.length];
    p.m.material = partMats[team]; p.m.visible = true; p.m.position.set(x, y, z);
    const a = rand(0, Math.PI * 2), s = rand(.3, 1) * spd;
    p.v.set(Math.cos(a) * s, rand(.4, 1) * up, Math.sin(a) * s);
    p.life = rand(.35, .8); p.s = rand(.6, 1.6);
  }
}
function updateParts(dt) {
  for (const p of parts) {
    if (!p.m.visible) continue;
    p.life -= dt;

    b.model.rotation.z = moving ? s * .06 : 0;
    b.legs[0].position.z = .05 + (moving ? s * .16 : 0); b.legs[1].position.z = .05 - (moving ? s * .16 : 0);
    const k = Math.min(1, b.swimT * 8); b.model.scale.set(1, .6 + .4 * k, 1);
    b.tankFill.scale.y = Math.max(.02, b.ink / 100);
  } else {
    const k = Math.min(1, b.swimT * 8);
    b.blob.scale.set(.5 + .5 * k + Math.sin(b.anim * 1.3) * .05, 1, .5 + .5 * k - Math.sin(b.anim * 1.3) * .05);
    b.blob.position.y = own ? -.08 : 0;
    let op = 1;
    if (own) op = b.isPlayer || b.team === player.team ? .55 : (b.pos.distanceTo(player.pos) < 4.5 ? .45 : .06);
    b.blobMat.opacity = op;
  }
  b.flash -= dt; b.furMat.emissiveIntensity = b.flash > 0 ? .9 : 0;
  b.root.visible = b.invuln > 0 ? (Math.floor(b.invuln * 12) % 2 === 0) : true;
  if (b.marker) { b.marker.position.y = (b.swimming ? 1.3 : 2.6) + Math.sin(performance.now() / 200) * .1; b.marker.rotation.y += dt * 3; }
}

// ---------------- input ----------------
const keys = {}; let mouseDown = false, wantBomb = false;
const mouseNDC = new THREE.Vector2(0, -.2), mousePx = { x: innerWidth / 2, y: innerHeight / 2 };
addEventListener('keydown', e => { keys[e.code] = true; if (['Space', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault(); if (e.code === 'KeyE' && !e.repeat) wantBomb = true; });
addEventListener('keyup', e => keys[e.code] = false);
addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouseDown = false; });
addEventListener('mousemove', e => { mousePx.x = e.clientX; mousePx.y = e.clientY; mouseNDC.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); });
renderer.domElement.addEventListener('mousedown', e => { if (e.button === 0) mouseDown = true; if (e.button === 2) wantBomb = true; });
addEventListener('mouseup', e => { if (e.button === 0) mouseDown = false; });
addEventListener('contextmenu', e => e.preventDefault());

const raycaster = new THREE.Raycaster(), groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), aimPoint = new THREE.Vector3(0, 0, 10);
const reticle = new THREE.Group();
reticle.add(new THREE.Mesh(new THREE.RingGeometry(.38, .55, 32), new THREE.MeshBasicMaterial({ color: '#ffffff', transparent: true, opacity: .95, depthWrite: false })));
reticle.add(new THREE.Mesh(new THREE.CircleGeometry(.12, 16), new THREE.MeshBasicMaterial({ color: TEAM_HEX[1], depthWrite: false })));
reticle.rotation.x = -Math.PI / 2; reticle.renderOrder = 5; scene.add(reticle);

function updatePlayerInput() {
  const b = player; if (b.dead) { b.firing = false; return; }
  const mx = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
  const mz = (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0);
  b.moveDir.set(mx, 0, mz); if (mx || mz) b.moveDir.normalize();
  b.wantSwim = !!(keys.ShiftLeft || keys.ShiftRight || keys.Space);
  raycaster.setFromCamera(mouseNDC, camera);
  if (raycaster.ray.intersectPlane(groundPlane, tmpV)) aimPoint.copy(tmpV);
  b.aim.copy(aimPoint);
  b.firing = mouseDown;
  if (wantBomb) { wantBomb = false; throwBomb(b, aimPoint); }
}

// ---------------- HUD ----------------
let toastT = null;
function toast(t) { const el = $('toast'); el.textContent = t; el.style.opacity = 1; clearTimeout(toastT); toastT = setTimeout(() => el.style.opacity = 0, 1300); }
let bigT = null;
function big(t, dur = 900, color = '#fff') { const el = $('big'); el.textContent = t; el.style.color = color; el.style.opacity = 1; clearTimeout(bigT); if (dur) bigT = setTimeout(() => el.style.opacity = 0, dur); }
function hitMarker() { const h = $('hitm'); h.style.left = mousePx.x + 'px'; h.style.top = mousePx.y + 'px'; h.style.opacity = 1; clearTimeout(h._t); h._t = setTimeout(() => h.style.opacity = 0, 120); }
function addFeed(by, b) {
  const el = document.createElement('div'); el.className = 'kf';
  el.innerHTML = by ? `<b class="t${by.team}">${by.name}</b> 击倒了 <b class="t${b.team}">${b.name}</b>` : `<b class="t${b.team}">${b.name}</b> 倒下了`;
  $('feed').prepend(el); setTimeout(() => el.remove(), 4000);
  while ($('feed').children.length > 5) $('feed').lastChild.remove();
}
const mini = $('mini').getContext('2d');
function drawMini() {
  mini.drawImage(paintCanvas, 0, 0, 170, 170);
  mini.fillStyle = '#5c5f78';
  for (const b of boxes) mini.fillRect((b.minX + HALF) / SIZE * 170, (b.minZ + HALF) / SIZE * 170, b.w / SIZE * 170, b.d / SIZE * 170);
  for (const b of bears) {
    if (b.dead) continue;
    if (b.team !== player.team && b.swimming && cellTeam(b.pos.x, b.pos.z) === b.team) continue;
    const x = (b.pos.x + HALF) / SIZE * 170, y = (b.pos.z + HALF) / SIZE * 170;
    mini.beginPath(); mini.arc(x, y, b.isPlayer ? 6 : 4.5, 0, Math.PI * 2);
    mini.fillStyle = b.isPlayer ? '#fff' : TEAM_HEX[b.team]; mini.fill(); mini.lineWidth = 2; mini.strokeStyle = '#2b2b44'; mini.stroke();
  }
}
function updateTeamDots() {
  for (const t of [1, 2]) $('tm' + t).innerHTML = bears.filter(b => b.team === t).map(b => `<div class="dot${b.dead ? ' dead' : ''}" style="background:${TEAM_HEX[t]}" title="${b.name}"></div>`).join('');
}
const fmt = s => { s = Math.max(0, Math.ceil(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
let covT = 0;
function updateHUD(dt) {
  $('timer').textContent = fmt(timeLeft);
  $('timer').style.color = timeLeft <= 10 ? '#ff5d73' : '#fff';
  $('tankfill').style.height = player.ink + '%';
  $('tank').classList.toggle('low', player.ink < 15);
  $('hpfill').style.width = Math.max(0, player.hp) + '%';
  $('bombfill').style.width = Math.min(100, player.ink / 55 * 100) + '%';
  $('bombfill').style.background = player.ink >= 55 ? '#ff9f1c' : '#2b2b44';
  $('inkvig').style.opacity = !player.dead && cellTeam(player.pos.x, player.pos.z) === 2 ? 1 : 0;
  if (player.dead) $('deadcd').textContent = `${Math.ceil(player.respawnT)} 秒后复活`;
  covT -= dt;
  if (covT <= 0) {
    covT = .2;
    const p1 = counts[1] / PAINTABLE * 100, p2 = counts[2] / PAINTABLE * 100;
    $('cov1').style.width = p1 + '%'; $('cov2').style.width = p2 + '%';
    $('c1t').textContent = p1.toFixed(1) + '%'; $('c2t').textContent = p2.toFixed(1) + '%';
    drawMini(); updateTeamDots();
  }
}

// ---------------- game flow ----------------
let state = 'menu', timeLeft = MATCH_TIME, countT = 0, shake = 0, endT = 0, lastBeep = 99, halfAnnounced = false;
function resetMatch() {
  grid.fill(0); counts[1] = counts[2] = 0; drawBaseFloor(); texDirty = true;
  for (const p of projs) scene.remove(p.mesh); projs.length = 0;
  for (const p of parts) p.m.visible = false;
  for (const b of bears) { b.kills = b.deaths = b.painted = 0; respawn(b); b.invuln = 0; }
  for (const t of [1, 2]) paint(SPAWN[t].x, SPAWN[t].z, 4.2, t, null, false);
  timeLeft = MATCH_TIME; lastBeep = 99; halfAnnounced = false;
  $('dead').style.display = 'none';
}
function startMatch() {
  initAudio(); resetMatch();
  $('start').style.display = 'none'; $('end').style.display = 'none'; $('hud').style.display = 'block';
  state = 'count'; countT = 3.2; lastBeep = 99;
  for (const b of bears) updateBear(b, 0.016);
}
function endMatch() {
  state = 'end'; endT = 1.8; mouseDown = false;
  for (const b of bears) { b.firing = false; b.moveDir.set(0, 0, 0); }
  big('比赛结束!', 1700); sfx.whistle();
}
function showResults() {
  const p1 = counts[1] / PAINTABLE * 100, p2 = counts[2] / PAINTABLE * 100;
  const w = $('winner');
  if (Math.abs(p1 - p2) < .05) { w.textContent = '平局!'; w.style.color = '#fff'; }
  else if (p1 > p2) { w.textContent = '🍯 蜂蜜队 胜利!'; w.style.color = TEAM_HEX[1]; }
  else { w.textContent = '🫐 蓝莓队 胜利!'; w.style.color = TEAM_HEX[2]; }
  $('p1').textContent = p1.toFixed(1) + '%'; $('p2').textContent = p2.toFixed(1) + '%';
  $('r1').style.width = '0'; $('r2').style.width = '0';
  $('stats').innerHTML = `你的战绩：涂地 <b>${Math.round(player.painted * CELL * CELL * 10)}p</b> · 击倒 <b>${player.kills}</b> · 被击倒 <b>${player.deaths}</b>`;
  $('end').style.display = 'flex'; $('hud').style.display = 'none';
  requestAnimationFrame(() => requestAnimationFrame(() => { $('r1').style.width = p1 + '%'; $('r2').style.width = p2 + '%'; }));
}
$('startbtn').onclick = startMatch;
$('restartbtn').onclick = startMatch;

// ---------------- loop ----------------
const clock = new THREE.Clock(); let menuT = 0;
const camOff = new THREE.Vector3(0, 14, 12.5), camLook = new THREE.Vector3(), camPos = new THREE.Vector3();
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), .05);
  if (state === 'menu') {
    menuT += dt;
    camera.position.set(Math.sin(menuT * .12) * 42, 28, Math.cos(menuT * .12) * 42); camera.lookAt(0, 0, 0);
  } else {
    if (state === 'count') {
      countT -= dt;
      const n = Math.ceil(countT - .2);
      if (n !== lastBeep) { lastBeep = n; if (n > 0) { big(String(n), 700); sfx.beep(false); } else { big('开始!', 900, TEAM_HEX[1]); sfx.beep(true); } }
      if (countT <= .2) { state = 'play'; lastBeep = 99; }
      updatePlayerInput();
      for (const b of bears) { b.moveDir.set(0, 0, 0); b.firing = false; b.wantSwim = false; updateBear(b, dt); }
    } else if (state === 'play') {
      timeLeft -= dt;
      updatePlayerInput();
      for (const b of bears) if (b.ai) updateAI(b, dt);
      for (const b of bears) updateBear(b, dt);
      updateProjs(dt);
      if (!halfAnnounced && timeLeft <= 60 && MATCH_TIME > 70) { halfAnnounced = true; big('还剩 1 分钟!', 1200); }
      const sec = Math.ceil(timeLeft);
      if (sec <= 10 && sec !== lastBeep && sec > 0) { lastBeep = sec; big(String(sec), 600, '#ff5d73'); sfx.beep(false); }
      if (timeLeft <= 0) { timeLeft = 0; endMatch(); }
    } else if (state === 'end') {
      for (const b of bears) updateBear(b, dt);
      updateProjs(dt);
      if (endT > 0) { endT -= dt; if (endT <= 0) showResults(); }
    }
    updateHUD(dt);
    // camera
    const lookAhead = tmpV.copy(aimPoint).sub(player.pos).setY(0).multiplyScalar(.2);
    if (lookAhead.length() > 4) lookAhead.setLength(4);
    camLook.copy(player.pos).add(lookAhead);
    camPos.copy(camLook).add(camOff);
    camera.position.lerp(camPos, 1 - Math.exp(-6 * dt));
    shake = Math.max(0, shake - dt * 1.5);
    const sx = rand(-1, 1) * shake, sz = rand(-1, 1) * shake;
    camera.position.x += sx; camera.position.z += sz;
    camera.lookAt(camera.position.x - camOff.x, 0, camera.position.z - camOff.z - 0);
    reticle.visible = !player.dead && state === 'play';
    reticle.position.set(aimPoint.x, .08, aimPoint.z);
    reticle.scale.setScalar(1 + (mouseDown ? Math.sin(performance.now() / 40) * .08 : 0));
  }
  updateParts(dt);
  if (texDirty) { floorTex.needsUpdate = true; texDirty = false; }
  renderer.render(scene, camera);
}
// menu decoration: pre-paint some splats and pose bears
for (const b of bears) respawn(b);
for (let i = 0; i < 40; i++) paint(rand(-28, 28), rand(-28, 28), rand(1, 2.5), i % 2 ? 1 : 2);
bears.forEach((b, i) => { b.invuln = 0; b.pos.set((i - 2.5) * 2.2, 0, 4); b.face = 0; b.aim.set(b.pos.x, 0, 10); updateBear(b, .016); });
frame();
let fpsN=0,fpsT=performance.now();(function f(){fpsN++;requestAnimationFrame(f)})();
window.__game = { get fps(){const n=performance.now(),r=fpsN/((n-fpsT)/1000);fpsN=0;fpsT=n;return r;}, get state() { return state; }, counts, PAINTABLE, player, bears, get timeLeft() { return timeLeft; }, startMatch };
</script>
</body>
</html>
